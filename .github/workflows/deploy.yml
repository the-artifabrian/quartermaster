name: 🚀 Deploy
on:
  push:
    branches:
      - master
      - dev
  pull_request: {}

permissions:
  actions: write
  contents: read

jobs:
  lint:
    # Stable branch-protection context; the lint command now runs Oxlint.
    name: ⬣ ESLint
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: ⎔ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🛠 Setup Database
        run: bunx prisma migrate deploy && bunx prisma generate

      - name: 🔬 Lint
        run: bun run lint

      # Vitest runs under Node, so this runs the Recipe URL import's address
      # pinning under the Bun above. It takes about a second, and this is the
      # fastest job that gates deploys, so a failure shows up under "⬣ ESLint".
      # It runs even when lint fails, so a lint error cannot hide its result.
      - name: 📌 Address pinning under Bun
        if: ${{ !cancelled() }}
        run: bun run test:address-pinning

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-typecheck
      cancel-in-progress: true
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: ⎔ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🏗 Build
        run: bun run build

      - name: 🛠 Apply migrations
        run: bunx prisma migrate deploy

      - name: 🔎 Type check
        run: bun run typecheck

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-vitest
      cancel-in-progress: true
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: ⎔ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🛠 Setup Database
        run: bunx prisma migrate deploy && bunx prisma generate

      - name: ⚡ Run vitest
        run: bun run test --coverage

  playwright:
    name: 🎭 Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # Guards merges without delaying deploys: pull requests only, and the
    # deploy job does not wait for it.
    if: ${{ github.event_name == 'pull_request' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-playwright
      cancel-in-progress: true
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: ⎔ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🏗 Build
        run: bun run build

      - name: 🛠 Setup Database
        run: bunx prisma migrate deploy && bun prisma/run-seed-infrastructure.ts

      - name: 📥 Install Playwright Browsers
        run: bunx playwright install --with-deps --only-shell chromium

      - name: 🎭 Playwright tests
        run: bunx playwright test

      - name: 📊 Upload report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  container:
    name: 📦 Prepare Container
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-container
      cancel-in-progress: true
    # only prepare container on pushes
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 50

      - name: 👀 Read app name
        id: app_name
        run:
          echo "value=$(grep '^app' fly.toml | sed 's/.*= *"\(.*\)"/\1/')" >>
          "$GITHUB_OUTPUT"

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: 📦 Build Staging Container
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          flyctl deploy \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --app ${{ steps.app_name.outputs.value }}-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 📦 Build Production Container
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          flyctl deploy \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --app ${{ steps.app_name.outputs.value }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, container]
    # Never interrupt a machine replacement. A newer successful run waits for
    # the active deploy (or supersedes an older run that is still queued).
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-deploy
      cancel-in-progress: false
    # only deploy on pushes
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: '50'

      - name: 👀 Read app name
        id: app_name
        run:
          echo "value=$(grep '^app' fly.toml | sed 's/.*= *"\(.*\)"/\1/')" >>
          "$GITHUB_OUTPUT"

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: 🚀 Deploy Staging
        if: ${{ github.ref == 'refs/heads/dev' }}
        run: |
          flyctl deploy \
            --image "registry.fly.io/${{ steps.app_name.outputs.value }}-staging:${{ github.sha }}" \
            --app ${{ steps.app_name.outputs.value }}-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: 🚀 Deploy Production
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          flyctl deploy \
            --image "registry.fly.io/${{ steps.app_name.outputs.value }}:${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
