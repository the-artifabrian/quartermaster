app = "quartermaster-94e5"
primary_region = "fra"
kill_signal = "SIGINT"
# server/shutdown.ts bounds application cleanup at 4s. Leave enough platform
# headroom for Fly to deliver SIGKILL only after that handler has completed.
kill_timeout = 10
processes = [ ]
swap_size_mb = 512

[experimental]
allowed_public_ports = [ ]
# Migrations run at boot and can be irreversible (e.g. DROP TABLE), so an
# automatic rollback to a pre-migration release would 500 against the new
# schema while healthchecks stay green. Roll back deliberately instead.
auto_rollback = false

# The memory watchdog (server/memory-watchdog.ts) exits non-zero on sustained
# memory exhaustion and relies on this policy to get the machine restarted.
# It matches the platform default — pinned so a future deploy can't silently
# change it.
[[restart]]
policy = "on-failure"
retries = 10
processes = [ "app" ]

[mounts]
source = "data"
destination = "/data"
# Fly's daily volume snapshots are the last-resort copy behind the offsite
# backups (.github/workflows/backup.yml) — pinned rather than left at the
# 5-day default so a leisurely "when did this data go wrong?" investigation
# still has something to restore from. Max is 60.
scheduled_snapshots = true
snapshot_retention = 14

[build]
dockerfile = "/other/Dockerfile"
ignorefile = "/other/Dockerfile.dockerignore"

[[services]]
internal_port = 8_080
processes = [ "app" ]
protocol = "tcp"
script_checks = [ ]

  [services.concurrency]
  hard_limit = 100
  soft_limit = 80
  type = "requests"

  [[services.ports]]
  handlers = [ "http" ]
  port = 80
  force_https = true

  [[services.ports]]
  handlers = [ "tls", "http" ]
  port = 443

  [[services.tcp_checks]]
  # Listener/process liveness. The HTTP check below verifies the persistent
  # resources the process needs without rendering an application document.
  grace_period = "1s"
  interval = "15s"
  restart_limit = 0
  timeout = "2s"

  [[services.http_checks]]
  # Keep this on the lightweight resource route. External uptime monitors
  # should use this route as well rather than probing the SSR homepage.
  interval = "10s"
  grace_period = "5s"
  method = "get"
  path = "/resources/healthcheck"
  protocol = "http"
  # Prisma waits up to 5s for a competing SQLite writer. Leave enough time for
  # that bounded wait to finish and for the route to return a useful 500.
  timeout = "7s"
  tls_skip_verify = false
  headers = { }

  [[services.http_checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/litefs/health"
