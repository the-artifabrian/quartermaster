name: 🩺 uptime check

# Requests the production healthcheck and fails when it doesn't answer 200, so
# GitHub emails the repo owner. Fly's own health checks only stop routing
# traffic to a sick machine, and they tell nobody.
#
# GitHub starts scheduled runs late when its queue is busy, sometimes by more
# than the 15 minute interval, so an outage shows up within half an hour or so
# rather than on the minute. A long outage sends an email for every failed run.
#
# GitHub turns off scheduled workflows in a public repository after 60 days
# with no commits. This job stops then, and so does the daily backup in
# backup.yml. Turn them back on in the Actions tab (see docs/RESTORE.md).
on:
  schedule:
    # Every 15 minutes, off the top of the hour, when the queue is busiest.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: 🩺 healthcheck answers 200
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: 🩺 Request the healthcheck
        env:
          URL: https://useqm.app/resources/healthcheck
        run: |
          # Two tries, so one dropped connection doesn't send an email. The
          # route can take up to 7s when SQLite is busy (see fly.toml), so 20s
          # is slow enough to count as down. Only 200 passes; a redirect fails.
          for attempt in 1 2; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 20 "$URL") || true
            if [ "$status" = 200 ]; then
              echo "Healthcheck answered 200 on try $attempt"
              exit 0
            fi
            # curl reports 000 when nothing came back at all.
            if [ "$status" = 000 ]; then status='no response'; fi
            echo "Try $attempt: $status"
            if [ "$attempt" = 1 ]; then
              sleep 30
            fi
          done
          echo "::error::$URL did not answer 200 on either try"
          exit 1
