# Documented example: https://github.com/superfly/litefs/blob/dec5a7353292068b830001bd2df4830e646f6a2f/cmd/litefs/etc/litefs.yml
fuse:
  # Required. This is the mount directory that applications will
  # use to access their SQLite databases.
  dir: '${LITEFS_DIR}'

data:
  # Path to internal data storage.
  dir: '/data/litefs'

proxy:
  # matches the internal_port in fly.toml
  addr: ':${INTERNAL_PORT}'
  target: 'localhost:${PORT}'
  db: '${DATABASE_FILENAME}'

# The lease section specifies how the cluster will be managed. We're using the
# "consul" lease type so that our application can dynamically change the primary.
#
# These environment variables will be available in your Fly.io application.
lease:
  type: 'consul'
  candidate: ${FLY_REGION == PRIMARY_REGION}
  promote: true
  advertise-url: 'http://${HOSTNAME}.vm.${FLY_APP_NAME}.internal:20202'

  consul:
    url: '${FLY_CONSUL_URL}'
    key: 'epic-stack-litefs_20250222/${FLY_APP_NAME}'

exec:
  # Validate the environment before anything mutates state. The app's init()
  # would catch the same problems, but only after the migration and seed below
  # have already changed the schema — and with auto_rollback disabled, a
  # machine that migrated and then refused to boot has no automatic way back.
  # A missing production secret should fail the deploy here, pre-migration.
  - cmd: bun /myapp/scripts/validate-env.ts
    if-candidate: true

  # Snapshot the database before migrations touch it. Migrations run against
  # the live file with auto_rollback disabled (see fly.toml), and some in
  # history are destructive, so this dump is the only way back from a bad one.
  # Local-only on purpose: boot must not wait on the network. The offsite copy
  # is the daily job in .github/workflows/backup.yml.
  #
  # This step fails the boot if it can't produce a verified snapshot — better a
  # machine that won't start than a migration with no way back. If a full
  # volume ever traps a deploy here, `fly secrets set SKIP_DB_BACKUP=true`
  # releases it; see docs/RESTORE.md.
  - cmd:
      bun /myapp/scripts/backup-db.ts --local-only --label pre-migration
      --skip-if-missing
    if-candidate: true

  # Prisma's schema engine always opens SQLite with locking_mode=EXCLUSIVE
  # (prisma-engines#4675), which LiteFS rejects on a WAL-mode database
  # (litefs#425) — applying any migration crash-loops the boot. Exclusive
  # locking IS compatible with a rollback journal, so switch to DELETE for
  # the migration step; WAL is restored below before the app starts.
  - cmd: sqlite3 $DATABASE_PATH "PRAGMA journal_mode = DELETE;"
    if-candidate: true

  - cmd: bunx prisma migrate deploy
    if-candidate: true

  # Seed infrastructure data (permissions, roles, tags). Idempotent.
  - cmd: bun prisma/run-seed-infrastructure.ts
    if-candidate: true

  # Set the journal mode for the database to WAL. This reduces concurrency deadlock issues
  - cmd: sqlite3 $DATABASE_PATH "PRAGMA journal_mode = WAL;"
    if-candidate: true

  # Set the journal mode for the cache to WAL. This reduces concurrency deadlock issues
  - cmd: sqlite3 $CACHE_DATABASE_PATH "PRAGMA journal_mode = WAL;"
    if-candidate: true

  - cmd: bun run start
