name: 🚀 Deploy
on:
  push:
    branches:
      - master
  pull_request: {}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: ⎔ Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🛠 Setup Database
        run: bunx prisma migrate deploy && bunx prisma generate

      - name: 🔬 Lint
        run: bun run lint

      # Vitest runs under Node, and production runs under Bun, so this checks
      # the Recipe URL import's address pinning under the Bun above. It takes
      # about a second, so it rides along in the fastest job that gates
      # deploys. It runs even when lint fails, so a lint error cannot hide it.
      - name: 📌 Recipe URL import address pinning (Bun)
        if: ${{ !cancelled() }}
        run: bun run test:address-pinning

  typecheck:
    name: ʦ TypeScript
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-typecheck
      cancel-in-progress: true
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: ⎔ Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🏗 Build
        run: bun run build

      - name: 🛠 Apply migrations
        run: bunx prisma migrate deploy

      - name: 🔎 Type check
        run: bun run typecheck

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-vitest
      cancel-in-progress: true
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: ⎔ Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🛠 Setup Database
        run: bunx prisma migrate deploy && bunx prisma generate

      - name: ⚡ Run vitest
        run: bun run test --coverage

  playwright:
    name: 🎭 Playwright
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # Guards merges without delaying deploys: pull requests only, and the
    # deploy job does not wait for it.
    if: ${{ github.event_name == 'pull_request' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-playwright
      cancel-in-progress: true
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: ⎔ Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: 📥 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🏗 Build
        run: bun run build

      # WAL, as production runs it (other/litefs.yml). The demo template is
      # built from tiny photos before the server starts; the server reads the
      # same DEMO_PHOTO_DIR, so it finds the template current.
      - name: 🛠 Setup Database
        run: |
          bunx prisma migrate deploy
          bun prisma/run-seed-infrastructure.ts
          bun tests/build-e2e-demo-template.ts
          bun prisma/journal-mode-wal.ts
        env:
          DEMO_PHOTO_DIR: ${{ runner.temp }}/demo-photos

      - name: 📥 Install Playwright Browsers
        run: bunx playwright install --with-deps --only-shell chromium

      - name: 🎭 Playwright tests
        run: bunx playwright test
        env:
          DEMO_PHOTO_DIR: ${{ runner.temp }}/demo-photos
          # Runner load makes the 34 ms bottom-nav feedback budget flaky; the
          # number is still logged to the report.
          BOTTOM_NAV_FEEDBACK_TRACE_ONLY: '1'

      - name: 📊 Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  container:
    name: 📦 Prepare Container
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-container
      cancel-in-progress: true
    # only prepare container on pushes
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 50

      - name: 👀 Read app name
        id: app_name
        run:
          echo "value=$(grep '^app' fly.toml | sed 's/.*= *"\(.*\)"/\1/')" >>
          "$GITHUB_OUTPUT"

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: 📦 Build Production Container
        run: |
          flyctl deploy \
            --build-only \
            --push \
            --image-label ${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --app ${{ steps.app_name.outputs.value }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, vitest, container]
    # Never interrupt a machine replacement. A newer successful run waits for
    # the active deploy (or supersedes an older run that is still queued).
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-deploy
      cancel-in-progress: false
    # only deploy on pushes
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: '50'

      - name: 👀 Read app name
        id: app_name
        run:
          echo "value=$(grep '^app' fly.toml | sed 's/.*= *"\(.*\)"/\1/')" >>
          "$GITHUB_OUTPUT"

      - name: 🎈 Setup Fly
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: 🚀 Deploy Production
        run: |
          flyctl deploy \
            --image "registry.fly.io/${{ steps.app_name.outputs.value }}:${{ github.sha }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
